; Projek Kawalan Aircond melalui Website
; Pilih board ikut apa yang anda ada:
;   pio run -e esp32 -t upload        (ESP32 DevKit)
;   pio run -e esp8266 -t upload      (NodeMCU / Wemos D1 mini)

[platformio]
default_envs = esp32

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    bblanchon/ArduinoJson @ ^7.2.0
extra_scripts = pre:tools/embed_html.py

[env:esp32]
platform = espressif32
board = esp32dev

[env:esp8266]
platform = espressif8266
board = nodemcuv2
